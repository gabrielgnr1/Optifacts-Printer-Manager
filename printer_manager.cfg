#	NOTES:
#		1) All <name_set> at 3-11-14-2 are required to start with "#P:"
#				The '#P:' substring isn't evaluated for matching. 
#		2) Avoid these characters for <name_set> definitions either here or at 3-11-14-2:
#				':'    '|'     '/'      '#' 
#				Any others are allowed, e.g: [_ - @ $ ! A..Z 0..9], etc
#		3) Leading and trailing withespaces are ignored, "  ABC  " is read as "ABC".
#		4) Spaces at the middle of the <name_set> are preserved, "AAA BBB" is read as "AAA BBB"
#		5) Rule matching follows a 4-level priority order (highest to lowest):
#				Priority 1: <name_set>  | <specific_user> -> Most specific. Stops searching immediately.
#				Priority 2a: <name_set> | default         -> Fallback for any user within a name_set.
#				Priority 2b: default    | <specific_user> -> Fallback for a specific user across all name_sets.
#				Priority 3: default     | default         -> Global fallback when no other rule matches.
#				No match found          -> File is moved to 'unprocessed' directory (!F:13).
#		6) The keyword 'default' (case-insensitive) in the 1st column acts as a wildcard
#				that matches any <name_set> not explicitly defined in this file.
#		7) The keyword 'default' (case-insensitive) in the 2nd column acts as a wildcard
#				that matches any <user_name> not explicitly defined for that name_set.
#		8) (Pending to Implement) - These columns are case insensitive: 1st, 2nd and 3rd.
#			
#	FILE FORMAT:
#		<NAME SET> | <user_name> or default | PDF or PS | <PRINTER NAME> or <DIRECTORY>
